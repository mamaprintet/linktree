<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mama Printet | Linktree</title>
    <!-- Favicon -->
    <link rel="icon" href="https://github.com/mamaprintet/linktree/blob/main/profil.jpg" type="image/x-icon" />
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Core theme CSS -->
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!-- Parallax Pixel Background Animation -->
    <section class="animated-background">
      <div id="stars1"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
    </section>
    <!-- End of Parallax Pixel Background Animation -->

    <a id="profilePicture" href="#popup">

    </a>

      <div class="popup">
        <div class="popup-photo">
          <a href="https://raw.githubusercontent.com/mamaprintet/linktree/main/profil.jpg" target="_blank">
            <img src="https://raw.githubusercontent.com/mamaprintet/linktree/main/profil.jpg" alt="Profile Picture">
          </a>
        </div>
        <div class="popup-quote">
          Ich gestalte kleine Dinge, die den Mamaalltag ein bisschen schöner machen.
        </div>
        <a class="popup-close" onclick="history.back()">&times;</a>
      </div>
    </div>

    <div id="userName">
      @mamaprintet
    </div>

    <div id="links">
      <a class="link" href="https://mamaprintet.etsy.com" target="_blank">
        <i class="fab fa-etsy">&nbsp;</i>Etsy
      </a>
      <a class="link" href="https://github.com/mamaprintet" target="_blank">
        <i class="fab fa-github">&nbsp;</i>Github
      </a>
      <a class="link" href="https://www.tiktok.com/@mama.printet" target="_blank">
        <i class="fab fa-tiktok">&nbsp;</i>TikTok
      </a>
      <a class="link" href="https://www.instagram.com/mama.printet" target="_blank">
        <i class="fab fa-instagram">&nbsp;</i>Instagram
      </a>
      <a class="link" href="https://www.youtube.com/@mama.printet" target="_blank">
        <i class="fab fa-youtube"></i>&nbsp;YouTube
      </a>
      <a class="link" href="https://buymeacoffee.com/mama.printet" target="_blank">
      <i class="fas fa-coffee"></i>&nbsp;Buy me a coffee
      </a>
    </div>

    <div id="hashtag">
      #Mamaalltag❤
    </div>
  </body>
</html>
